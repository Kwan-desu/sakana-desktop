<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Sakana Platform Architecture">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.8s linear infinite; }
      .flow-line-slow { stroke-dasharray: 6 6; animation: dashFlow 2.2s linear infinite; }
      .p1 { animation: pulseNode 2.4s ease-in-out infinite; }
      .p2 { animation: pulseNode 2.4s ease-in-out 0.6s infinite; }
      .p3 { animation: pulseNode 2.4s ease-in-out 1.2s infinite; }
      .p4 { animation: pulseNode 2.4s ease-in-out 1.8s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .flow-line-slow, .p1, .p2, .p3, .p4 { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="408" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700">Sakana Architecture</text>
  <text x="226" y="42" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Single-Host FastAPI + WebSocket Control Plane</text>
  <circle cx="1116" cy="38" r="4" fill="#22C55E" class="p1"/>
  <text x="1126" y="42" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LIVE</text>
  <line x1="36" y1="58" x2="1164" y2="58" stroke="#1E293B" stroke-width="1"/>

  <!-- Column 1: Interfaces -->
  <g transform="translate(36, 82)">
    <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">01 · CONTROL SURFACES</text>

    <rect x="0" y="16" width="288" height="86" rx="12" fill="#111827" stroke="#24324B" stroke-width="1.2"/>
    <circle cx="268" cy="36" r="3.5" fill="#38BDF8" class="p1"/>
    <text x="18" y="43" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Editorial Web Workspace</text>
    <text x="18" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Chat · Streaming Traces · Unified Diffs</text>
    <text x="18" y="84" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">index.html · OLED Dark / Light</text>

    <rect x="0" y="116" width="288" height="86" rx="12" fill="#111827" stroke="#24324B" stroke-width="1.2"/>
    <circle cx="268" cy="136" r="3.5" fill="#38BDF8" class="p2"/>
    <text x="18" y="143" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Live PTY Terminal</text>
    <text x="18" y="165" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Multi-tab xterm.js · Quick Commands</text>
    <text x="18" y="184" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">ws://host:8420/ws/terminal</text>

    <rect x="0" y="216" width="288" height="86" rx="12" fill="#111827" stroke="#24324B" stroke-width="1.2"/>
    <circle cx="268" cy="236" r="3.5" fill="#38BDF8" class="p3"/>
    <text x="18" y="243" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Discord Bot &amp; Quick Invite</text>
    <text x="18" y="265" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Slash Commands · RBAC · Approvals</text>
    <text x="18" y="284" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">backend/discord_bot/bot.py</text>
  </g>

  <!-- Animated Arrows Col 1 -> Col 2 -->
  <g stroke="#38BDF8" stroke-width="1.6" fill="none">
    <line x1="328" y1="141" x2="404" y2="141" opacity="0.35"/>
    <line x1="328" y1="141" x2="404" y2="141" class="flow-line" marker-end="url(#arrowBlue)"/>
    <line x1="328" y1="241" x2="404" y2="241" opacity="0.35"/>
    <line x1="328" y1="241" x2="404" y2="241" class="flow-line" marker-end="url(#arrowBlue)"/>
    <line x1="328" y1="341" x2="404" y2="341" opacity="0.35"/>
    <line x1="328" y1="341" x2="404" y2="341" class="flow-line" marker-end="url(#arrowBlue)"/>
  </g>
  <!-- Moving cyan packets Col 1 -> Col 2 -->
  <circle r="3.2" fill="#7DD3FC">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M 328 141 L 400 141"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#7DD3FC">
    <animateMotion dur="2.1s" begin="0.7s" repeatCount="indefinite" path="M 328 241 L 400 241"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#7DD3FC">
    <animateMotion dur="2.1s" begin="1.4s" repeatCount="indefinite" path="M 328 341 L 400 341"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.1s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Column 2: Sakana Core -->
  <g transform="translate(414, 82)">
    <text x="0" y="0" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">02 · SAKANA FASTAPI CORE</text>
    <rect x="0" y="16" width="368" height="286" rx="14" fill="#0F172A" stroke="#2B3F6B" stroke-width="1.5"/>
    <rect x="0" y="16" width="368" height="5" rx="2.5" fill="url(#accentBar)"/>

    <text x="20" y="49" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">SakanaOrchestrator</text>
    <text x="20" y="69" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">backend/main.py · agent/orchestrator.py</text>

    <!-- Core modules grid -->
    <g transform="translate(18, 86)">
      <rect x="0" y="0" width="160" height="58" rx="9" fill="#111C33" stroke="#24375C" stroke-width="1"/>
      <text x="12" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Terminal Guard</text>
      <text x="12" y="42" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">4-Tier Policy &amp; Approvals</text>

      <rect x="172" y="0" width="160" height="58" rx="9" fill="#111C33" stroke="#24375C" stroke-width="1"/>
      <text x="184" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">MCP + Ask AI Hub</text>
      <text x="184" y="42" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Global + Project Skills</text>

      <rect x="0" y="68" width="160" height="58" rx="9" fill="#111C33" stroke="#24375C" stroke-width="1"/>
      <text x="12" y="91" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Usage &amp; Accounts</text>
      <text x="12" y="110" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">5h / 7d Quota Tracking</text>

      <rect x="172" y="68" width="160" height="58" rx="9" fill="#111C33" stroke="#24375C" stroke-width="1"/>
      <text x="184" y="91" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Automations</text>
      <text x="184" y="110" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Cron · Webhooks · Ask AI</text>

      <rect x="0" y="136" width="332" height="52" rx="9" fill="#0B1221" stroke="#1F2E4D" stroke-width="1"/>
      <text x="14" y="159" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">SQLite Persistence + .env Secret Isolation</text>
      <text x="14" y="177" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">data/sakana.db · Sessions · Traces · Approvals</text>
    </g>
  </g>

  <!-- Animated Arrows Col 2 -> Col 3 -->
  <g stroke="#818CF8" stroke-width="1.6" fill="none">
    <line x1="786" y1="134" x2="864" y2="134" opacity="0.35"/>
    <line x1="786" y1="134" x2="864" y2="134" class="flow-line-slow" marker-end="url(#arrowIndigo)"/>
    <line x1="786" y1="208" x2="864" y2="208" opacity="0.35"/>
    <line x1="786" y1="208" x2="864" y2="208" class="flow-line-slow" marker-end="url(#arrowIndigo)"/>
    <line x1="786" y1="282" x2="864" y2="282" opacity="0.35"/>
    <line x1="786" y1="282" x2="864" y2="282" class="flow-line-slow" marker-end="url(#arrowIndigo)"/>
    <line x1="786" y1="354" x2="864" y2="354" opacity="0.35"/>
    <line x1="786" y1="354" x2="864" y2="354" class="flow-line-slow" marker-end="url(#arrowIndigo)"/>
  </g>
  <!-- Moving indigo packets Col 2 -> Col 3 -->
  <circle r="3.2" fill="#A5B4FC">
    <animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" path="M 786 134 L 860 134"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#A5B4FC">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 786 208 L 860 208"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#A5B4FC">
    <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M 786 282 L 860 282"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#A5B4FC">
    <animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite" path="M 786 354 L 860 354"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Column 3: Agent Harnesses -->
  <g transform="translate(874, 82)">
    <text x="0" y="0" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">03 · AGENT HARNESSES</text>

    <rect x="0" y="16" width="290" height="64" rx="11" fill="#111827" stroke="#2B2E52" stroke-width="1.2"/>
    <circle cx="270" cy="36" r="3.5" fill="#818CF8" class="p1"/>
    <text x="16" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">AGY CLI (Antigravity)</text>
    <text x="16" y="62" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Isolated OAuth profiles · stream-json</text>

    <rect x="0" y="90" width="290" height="64" rx="11" fill="#111827" stroke="#2B2E52" stroke-width="1.2"/>
    <circle cx="270" cy="110" r="3.5" fill="#818CF8" class="p2"/>
    <text x="16" y="116" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Claude Code CLI</text>
    <text x="16" y="136" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Native sessions · .mcp.json · /verify</text>

    <rect x="0" y="164" width="290" height="64" rx="11" fill="#111827" stroke="#2B2E52" stroke-width="1.2"/>
    <circle cx="270" cy="184" r="3.5" fill="#818CF8" class="p3"/>
    <text x="16" y="190" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Kiro CLI</text>
    <text x="16" y="210" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Workspace MCP · /delegate</text>

    <rect x="0" y="238" width="290" height="64" rx="11" fill="#111827" stroke="#2B2E52" stroke-width="1.2"/>
    <circle cx="270" cy="258" r="3.5" fill="#818CF8" class="p4"/>
    <text x="16" y="264" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Sakana Master / Gemini Bridge</text>
    <text x="16" y="284" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Direct orchestration · Cross-harness</text>
  </g>
</svg>
