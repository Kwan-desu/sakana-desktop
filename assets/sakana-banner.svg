<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sakana — Autonomous Linux Agentic Control Surface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="55%" stop-color="#0B101D"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="86%" cy="24%" r="36%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fishGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="318" rx="18"/>
    </clipPath>
    <style>
      @keyframes swim {
        0%, 100% { transform: translate(22px, 34px); }
        50% { transform: translate(22px, 28px); }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-6deg); }
      }
      @keyframes bubble1 {
        0% { transform: translateY(6px); opacity: 0; }
        25% { opacity: 0.9; }
        85% { opacity: 0.7; }
        100% { transform: translateY(-16px); opacity: 0; }
      }
      @keyframes bubble2 {
        0% { transform: translateY(8px); opacity: 0; }
        30% { opacity: 0.75; }
        85% { opacity: 0.5; }
        100% { transform: translateY(-20px); opacity: 0; }
      }
      @keyframes waveFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes glowBreath {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .fish-bob { animation: swim 4.2s ease-in-out infinite; }
      .fish-tail { transform-origin: 26px 54px; animation: tailWag 2.1s ease-in-out infinite; }
      .b1 { animation: bubble1 3.2s ease-out infinite; }
      .b2 { animation: bubble2 3.2s ease-out 1.4s infinite; }
      .wave-1 { stroke-dasharray: 18 10; animation: waveFlow 7s linear infinite; }
      .wave-2 { stroke-dasharray: 12 14; animation: waveFlow 10s linear infinite reverse; }
      .pulse-1 { animation: pulseDot 2.2s ease-in-out infinite; }
      .pulse-2 { animation: pulseDot 2.2s ease-in-out 0.7s infinite; }
      .pulse-3 { animation: pulseDot 2.2s ease-in-out 1.4s infinite; }
      .cursor { animation: blinkCursor 1.1s step-end infinite; }
      .ambient { animation: glowBreath 5.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fish-bob, .fish-tail, .b1, .b2, .wave-1, .wave-2, .pulse-1, .pulse-2, .pulse-3, .cursor, .ambient {
          animation: none;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowLeft)" class="ambient"/>
    <rect width="1200" height="320" fill="url(#glowRight)" class="ambient"/>

    <!-- Flowing animated current lines -->
    <path d="M 0 258 C 220 220, 420 295, 680 248 C 900 208, 1050 264, 1200 236" fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
    <path d="M 0 258 C 220 220, 420 295, 680 248 C 900 208, 1050 264, 1200 236" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" class="wave-1"/>
    <path d="M 0 278 C 260 246, 480 306, 740 266 C 950 234, 1080 282, 1200 260" fill="none" stroke="url(#waveGrad)" stroke-width="1" opacity="0.65"/>
    <path d="M 0 278 C 260 246, 480 306, 740 266 C 950 234, 1080 282, 1200 260" fill="none" stroke="#818CF8" stroke-opacity="0.28" stroke-width="1" class="wave-2"/>

    <!-- Emblem badge container -->
    <g transform="translate(72, 68)">
      <rect x="0" y="0" width="176" height="176" rx="28" fill="#0F1626" stroke="#1F2A44" stroke-width="1.5"/>
      <rect x="10" y="10" width="156" height="156" rx="22" fill="#0A0F1C" stroke="#253352" stroke-width="1"/>

      <!-- Animated geometric Sakana (fish) emblem -->
      <g class="fish-bob" transform="translate(22, 34)">
        <!-- Tail fin -->
        <path class="fish-tail" d="M 22 54 L 2 28 C 12 32, 22 40, 28 48 L 28 60 C 22 68, 12 76, 2 80 Z" fill="url(#fishGrad)" opacity="0.9"/>
        <!-- Dorsal fin -->
        <path d="M 52 34 C 66 16, 86 14, 96 26 C 82 28, 70 33, 58 38 Z" fill="#38BDF8" opacity="0.78"/>
        <!-- Ventral fin -->
        <path d="M 54 74 C 66 90, 82 92, 92 82 C 80 80, 68 76, 58 70 Z" fill="#818CF8" opacity="0.72"/>
        <!-- Main sleek body -->
        <path d="M 24 54 C 42 26, 84 22, 122 54 C 84 86, 42 82, 24 54 Z" fill="url(#fishGrad)"/>
        <!-- Inner contour lines -->
        <path d="M 44 54 C 58 39, 82 37, 104 54 C 82 71, 58 69, 44 54 Z" fill="none" stroke="#09101E" stroke-width="2.2" opacity="0.42"/>
        <path d="M 74 39 C 80 49, 80 59, 74 69" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <!-- Eye -->
        <circle cx="98" cy="49" r="4.2" fill="#07090F"/>
        <circle cx="99.4" cy="47.6" r="1.4" fill="#F8FAFC"/>
        <!-- Rising motion bubbles -->
        <circle class="b1" cx="129" cy="39" r="2.6" fill="#38BDF8"/>
        <circle class="b2" cx="136" cy="29" r="1.8" fill="#818CF8"/>
      </g>
    </g>

    <!-- Wordmark & Tagline -->
    <g transform="translate(284, 86)">
      <g>
        <rect x="0" y="0" width="168" height="24" rx="12" fill="#111C33" stroke="#243B66" stroke-width="1"/>
        <circle cx="14" cy="12" r="3.5" fill="#38BDF8" class="pulse-1"/>
        <text x="25" y="16" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.8">SAKANA · 魚 AGENT</text>
      </g>

      <text x="0" y="84" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Sakana</text>
      <text x="218" y="82" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" opacity="0.92">Linux Agentic Control Surface</text>

      <text x="0" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">Self-hosted multi-harness workspace with Live PTY Terminal, Discord sync, MCP hub &amp; Terminal Guard.</text>

      <!-- Feature pills -->
      <g transform="translate(0, 142)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="136" height="28" rx="8" fill="#111827" stroke="#26324A" stroke-width="1"/>
        <text x="14" y="18" fill="#E2E8F0">Multi-Harness</text>

        <rect x="146" y="0" width="144" height="28" rx="8" fill="#111827" stroke="#26324A" stroke-width="1"/>
        <text x="160" y="18" fill="#E2E8F0">Live PTY Shell</text>

        <rect x="300" y="0" width="132" height="28" rx="8" fill="#111827" stroke="#26324A" stroke-width="1"/>
        <text x="314" y="18" fill="#E2E8F0">Discord Sync</text>

        <rect x="442" y="0" width="136" height="28" rx="8" fill="#111827" stroke="#26324A" stroke-width="1"/>
        <text x="456" y="18" fill="#E2E8F0">MCP + Ask AI</text>

        <rect x="588" y="0" width="148" height="28" rx="8" fill="#111827" stroke="#26324A" stroke-width="1"/>
        <text x="602" y="18" fill="#E2E8F0">Terminal Guard</text>
      </g>
    </g>

    <!-- Right live telemetry terminal card -->
    <g transform="translate(950, 46)" opacity="0.95">
      <rect x="0" y="0" width="204" height="122" rx="12" fill="#0D1322" stroke="#1E2B45" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#EF4444" opacity="0.85"/>
      <circle cx="28" cy="16" r="3.5" fill="#F59E0B" opacity="0.85"/>
      <circle cx="40" cy="16" r="3.5" fill="#22C55E" opacity="0.85"/>
      <text x="56" y="19.5" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">sakana :8420</text>
      <line x1="0" y1="30" x2="204" y2="30" stroke="#1E2B45" stroke-width="1"/>
      <text x="14" y="50" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">$ agy · claude · kiro</text>
      <rect x="153" y="40" width="6" height="12" rx="1" fill="#38BDF8" class="cursor"/>
      <circle cx="53" cy="67" r="3" fill="#38BDF8" class="pulse-1"/>
      <text x="14" y="70" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">pty     interactive</text>
      <circle cx="53" cy="85" r="3" fill="#818CF8" class="pulse-2"/>
      <text x="14" y="88" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">bot     synced</text>
      <circle cx="53" cy="103" r="3" fill="#4ADE80" class="pulse-3"/>
      <text x="14" y="106" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">guard   active</text>
    </g>
  </g>

  <!-- Outer crisp border -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
